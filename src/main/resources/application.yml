server:
  port: 8080

spring:
  application:
    name: livraria-api

  datasource:
    url: jdbc:h2:mem:livraria;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Preco padrao aplicado a livros importados da Google Books API
# (a API do Google nao retorna preco, entao usamos um valor placeholder)
livraria:
  import:
    default-price: 39.90

logging:
  level:
    com.gi.livraria: INFO
